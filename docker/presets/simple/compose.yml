services:
  app:
    build:
      context: .
      dockerfile: ./docker/presets/simple/app.Dockerfile
    restart: unless-stopped
    environment:
      FASTAD_ALLINONE_POSTGRES_DSN: ${FASTAD_POSTGRES_DSN}
      FASTAD_MIGRATOR_POSTGRES_DSN: ${FASTAD_POSTGRES_DSN}
      FASTAD_ALLINONE_INTERCOM_TOKEN: ${FASTAD_INTERCOM_TOKEN}
      FASTAD_ALLINONE_TEMPORAL_ADDRESS: "temporal:7233"
      FASTAD_ALLINONE_API_LISTEN_ADDRESS: ":8080"
      FASTAD_LOG_LEVEL: ${FASTAD_LOG_LEVEL}
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy

  caddy:
    build:
      context: .
      dockerfile: ./docker/presets/simple/caddy.Dockerfile
    restart: unless-stopped
    ports:
      - "${CADDY_PORT}:80"
    volumes:
      - ./docker/presets/simple/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  temporal:
    image: temporalio/auto-setup:1.26.2
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: ${TEMPORAL_POSTGRES_PORT}
      DBNAME: ${TEMPORAL_POSTGRES_DATABASE}
      VISIBILITY_DBNAME: ${TEMPORAL_POSTGRES_DATABASE}
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER}
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD}
      POSTGRES_SEEDS: ${TEMPORAL_POSTGRES_HOST}
      POSTGRES_TLS_ENABLED: ${TEMPORAL_POSTGRES_TLS}
      SKIP_DB_CREATE: ${TEMPORAL_SKIP_DB_CREATE}
    depends_on:
      temporal-postgres:
        condition: service_healthy
    healthcheck:
      test: [ 'CMD-SHELL', 'tctl --address temporal:7233 workflow list' ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1m

  temporal-ui:
    image: temporalio/ui:2.33.0
    restart: unless-stopped
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_UI_PORT=8080
      - TEMPORAL_UI_PUBLIC_PATH=/temporal
    depends_on:
      temporal:
        condition: service_started

  postgres:
    image: postgres:17.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fastad
      POSTGRES_PASSWORD: fastad
      POSTGRES_DB: fastad
    volumes:
      - fastad-db:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U fastad -d fastad
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  temporal-postgres:
    image: postgres:17.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD}
      POSTGRES_DB: ${TEMPORAL_POSTGRES_DATABASE}
    volumes:
      - temporal-db:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U temporal -d temporal
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  fastad-db:
  temporal-db:
  caddy-data:
  caddy-config:
