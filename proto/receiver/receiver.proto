syntax = "proto3";

package receiver;

message SubmitFlagsRequest {
  repeated string flags = 1;
  string team_token = 2;
}

message FlagResponse {
  enum Verdict {
    VERDICT_UNSPECIFIED = 0;
    VERDICT_ACCEPTED = 1;
    VERDICT_OWN = 2;
    VERDICT_OLD = 3;
    VERDICT_INVALID = 4;
    VERDICT_DUPLICATE = 5;
    VERDICT_FLAG_NOT_READY = 6;
  }

  string flag = 1;
  FlagResponse.Verdict verdict = 2;
  string message = 3;
  int64 victim_id = 4;
  int64 service_id = 5;
  double attacker_delta = 6;
  double victim_delta = 7;
}

message AttackNotification {
  message Batch {
    repeated AttackNotification attacks = 1;
  }

  int64 attacker_id = 1;
  int64 victim_id = 2;
  int64 service_id = 3;
  double attacker_delta = 4;
  double victim_delta = 5;
}

message State {
  message TeamService {
    int64 team_id = 1;
    int64 service_id = 2;
    double points = 3;
    int64 flags_stolen = 4;
    int64 flags_lost = 5;
  }

  repeated TeamService team_services = 1;
}

message SubmitFlagsResponse {
  repeated FlagResponse responses = 1;
}

message GetStateRequest {
}

message GetStateResponse {
  State state = 1;
}
