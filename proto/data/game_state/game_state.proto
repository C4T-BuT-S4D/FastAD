syntax = "proto3";

package data.game_state;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

import "data/version/version.proto";

message GameState {
  google.protobuf.Timestamp start_time = 1;
  google.protobuf.Timestamp end_time = 2;
  uint64 total_rounds = 3;

  bool paused = 4;
  bool finished = 5;

  uint64 flag_lifetime_rounds = 6;
  google.protobuf.Duration round_duration = 7;

  uint64 running_round = 8;
  google.protobuf.Timestamp running_round_start = 9;

  double hardness = 10;
  bool inflation = 11;

  reserved 12 to 100;
}

message GetRequest {
  data.version.Version version = 1;
}

message GetResponse {
  data.game_state.GameState game_state = 1;
  data.version.Version version = 2;
}

message UpdateRequest {
  google.protobuf.Timestamp start_time = 1;

  // Zero time means no end time.
  google.protobuf.Timestamp end_time = 2;

  optional uint64 total_rounds = 3;

  optional bool paused = 4;

  optional uint64 flag_lifetime_rounds = 5;
  google.protobuf.Duration round_duration = 6;

  optional double hardness = 8;
  optional bool inflation = 9;
}

message UpdateResponse {
  data.game_state.GameState game_state = 1;
  data.version.Version version = 2;
}

message UpdateRoundRequest {
  uint64 running_round = 1;
  google.protobuf.Timestamp running_round_start = 2;
}

message UpdateRoundResponse {
  data.game_state.GameState game_state = 1;
  data.version.Version version = 2;
}

message FinishGameRequest {
}

message FinishGameResponse {
  data.game_state.GameState game_state = 1;
  data.version.Version version = 2;
}

message CreateRequest {
  GameState game_state = 1;
}

message CreateResponse {
  data.game_state.GameState game_state = 1;
  data.version.Version version = 2;
}
