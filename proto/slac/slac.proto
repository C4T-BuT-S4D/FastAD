syntax = "proto3";

package slac;

import "checker/checker.proto";

message TeamServiceState {
  message CheckStatus {
    checker.Status status = 1;
    string message = 2;
  }

  int64 team_id = 1;
  int64 service_id = 2;
  int64 checks_total = 3;
  int64 checks_passed = 4;
  repeated CheckStatus check_statuses = 5;
}

message State {
  repeated TeamServiceState team_service_states = 1;
}

message GetStateRequest {
}

message GetStateResponse {
  State state = 1;
}
